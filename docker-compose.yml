version: '3.8'

services:
  tp-db:
    image: postgres:16
    container_name: tp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/backups:/backups
      - ./db/init:/docker-entrypoint-initdb.d
      - ./shared:/shared
    networks:
      - totvs-net

  tp-licenseserver:
    image: oraclelinux:10
    container_name: tp-licenseserver
    restart: unless-stopped
    privileged: true
    command: /sbin/init
    ports:
      - "5555:5555"
    volumes:
      - ./docker/licenseserver:/totvs/licenseserver
      - ./config/license-server.service:/etc/systemd/system/license-server.service
      - ./shared:/shared
    networks:
      - totvs-net

  tp-dbaccess:
    image: oraclelinux:10
    container_name: tp-dbaccess
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      - tp-db
      - tp-licenseserver
    volumes:
      - ./docker/dbaccess:/totvs/protheus/bin/dbaccess
      - ./shared:/shared
    networks:
      - totvs-net

  tp-appserver:
    image: oraclelinux:10
    container_name: tp-appserver
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      - tp-dbaccess
      - tp-licenseserver
    volumes:
      - ./docker/appserver:/totvs/protheus/bin/appserver
      - ./docker/appserver/apo:/totvs/protheus/bin/apo
      - ./shared:/shared
    networks:
      - totvs-net

  tp-smartview:
    image: oraclelinux:10
    container_name: tp-smartview
    restart: unless-stopped
    privileged: true
    command: /sbin/init
    depends_on:
      - tp-db
      - tp-licenseserver
    ports:
      - "7019:7019"
    volumes:
      - ./docker/smartview:/usr/sbin/smart-view
      - ./config/smart-view-agent.service:/etc/systemd/system/smart-view-agent.service
      - ./shared:/shared
    networks:
      - totvs-net

  tp-dashboard:
    image: node:20-alpine
    container_name: tp-dashboard
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3000:3000"
    command: >
      sh -c "apk add --no-cache docker-cli >/dev/null 2>&1 &&
             if [ -f package.json ]; then npm install --production; fi &&
             node server.js"
    networks:
      - totvs-net

networks:
  totvs-net:
    driver: bridge
