[environment]
SourcePath=/totvs/protheus/bin/apo
RPOCustom=/totvs/protheus/bin/apo/custom.rpo
RootPath=/totvs/protheus_data
StartPath=/system/
RpoDb=top
RpoLanguage=Portuguese
RpoVersion=120
LocalFiles=CTREE
Trace=0
localdbextension=.dtc
TopMemoMega=1
PictFormat=DEFAULT
RegionalLanguage=BRA
SpecialKey=environment
StartSysInDB=1

[DBAccess]
DataBase=postgres
Server=tp-dbaccess
ALIAS=protheus
PROTHEUSONLY=0

[General]
CONSOLELOG=1
CONSOLEFILE=/totvs/protheus/bin/appserver/appserver.log
InstallPath=/totvs/
CanAcceptFSRemote=1
ASyncConsoleLog=0
App_Environment=environment

[Drivers]
ACTIVE=TCP
;MultiProtocolPortSecure=1
MultiProtocolPort=1

[TCP]
TYPE=TCPIP
PORT=1234

[LICENSECLIENT]
SERVER=tp-licenseserver
PORT=5555

[WEBAPP]
PORT=1235

[WebApp/webapp]
MPP=

[HTTP]
ENABLE=1
PORT=80
Path=/totvs/protheus_data/http-root

[ONSTART]
JOBS=HTTPJOB
REFRESHRATE=120

[HTTPJOB]
MAIN=HTTP_START
ENVIRONMENT=environment

[HTTPV11]
Enable=1
Sockets=HTTPREST

[HTTPREST]
Port=1236
URIs=HTTPURI
Security=1

[HTTPURI]
URL=/rest
PrepareIn=99
Instances=1,2
CORSEnable=1
AllowOrigin=*